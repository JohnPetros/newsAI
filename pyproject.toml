[project]
name = "newsai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "agentql>=1.13.0",
  "agno>=2.3.9",
  "ddgs>=9.9.3",
  "duckduckgo-search>=8.1.1",
  "fastapi[standard]>=0.116.1",
  "httpx>=0.28.1",
  "google-genai>=1.54.0",
  "googlesearch-python>=1.3.0",
  "inngest>=0.5.13",
  "openai>=1.75.0",
  "playwright>=1.40.0",
  "pycountry>=24.6.1",
  "pydantic>=2.11.7",
  "python-dotenv>=1.1.1",
  "requests>=2.32.4",
  "tenacity>=8.5.0",
  "firecrawl-py>=4.22.1",
]

[tool.ruff.lint.isort]
known-first-party = ["newsai"]

[tool.poe]
executor.type = "uv"

[tool.poe.tasks]
# dev = "uv run fastapi dev src/main.py"
dev = "uv run python src/main.py"
ai = "uv run python src/newsai/playground.py"
messaging = "npx --ignore-scripts=false inngest-cli@latest dev -u http://127.0.0.1:8000/api/inngest --no-discovery"
genai = "uv run python src/genai.py"
test = "uv run pytest -s -x -vv"
typecheck = "uv run basedpyright"

[tool.poe.tasks.codecheck]
shell = "uv run ruff check --fix src tests && uv run ruff format --check src tests"

[tool.ruff]
line-length = 88
target-version = "py313"
fix = true
show-fixes = true
indent-width = 4
exclude = ["venv", ".venv", "env", ".env", "node_modules", "__pycache__"]

[tool.ruff.lint]
select = [
  "ASYNC",
  "A",
  "ANN",
  "B",
  "BLE",
  "C4",
  "C90",
  "COM",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FBT",
  "FIX",
  "I",
  "ICN",
  "ISC",
  "Q",
  "RET",
  "RSE",
  "S",
  "SIM",
  "SLF",
  "T10",
  "T20",
  "TC",
  "TD",
  "TRY",
  "UP",
  "W",
  "YTT",
  "RUF",
  "N",
]
ignore = [
  "T201",
  "COM812",
  "E501",
  "I001",
  "TRY003",
  "EM101",
  "F841",
  "ANN205",
  "ANN401",
  "TID252",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN201", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"


[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
include = ["src", 'tests']
exclude = [
  "**/venv",
  "**/.venv",
  "**/env",
  "**/.env",
  "**/node_modules",
  "**/__pycache__",
]
venv = ".venv"
venvPath = "."
executionEnvironments = [{ root = "src" }]
reportMissingImports = "none"
reportImplicitRelativeImport = "none"
reportUnknownParameterType = "none"
reportUnknownReturnType = "none"
reportUnknownLambdaType = "none"
reportUnknownLambdaReturnType = "none"
reportUnknownLambdaParameterType = "none"
reportUnknownVariableType = "none"
reportUnknownVariableReturnType = "none"
reportUnknownVariableParameterType = "none"
reportUnknownMemberType = "none"

[tool.pytest.ini_options]
addopts = "-s --color=yes --tb=short"
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
  "basedpyright>=1.38.2",
  "poethepoet>=0.36.0",
  "pyright>=1.1.408",
  "pytest>=9.0.2",
  "pytest-mock>=3.15.1",
  "ruff>=0.15.0",
]

[tool.basedpyright.diagnosticSeverityOverrides]
reportMissingTypeStubs = "none"
